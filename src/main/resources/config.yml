# SwornGuns Configuration
# This is mostly for realism features
# By dmulloy2

# Block break effect when entities are hit
# Defaults to redstone block
# guns-only: Do blood effect for only guns
blood-effect:
  enabled: true
  block-id: REDSTONE_BLOCK
  guns-only: false

# Smoke effect when entities are hit by a bullet
smoke-effect: true

# Sound made when an entity is hit by a bullet
# A list of valid sounds can be found here:
# http://jd.bukkit.org/rb/apidocs/org/bukkit/Sound.html
bullet-sound:
  enabled: true
  sound: entity.magma_cube.jump

# Blocks broken when shot
block-shatter:
  enabled: true
  blocks:
    - oak_leaves
    - glass
    - glass_pane
    - sand
    - gravel

# Crackable blocks crack when shot
block-crack: true

# Reset only gun projectile hit delay so fast bullets and shotgun pellets
# are not suppressed by Minecraft's generic damage immunity.
projectile_only_no_hit_delay: true

# Number of no-damage ticks to leave after a confirmed gun projectile hit.
# 0 fully resets the projectile hit delay, 1 keeps a minimal delay.
projectile_no_hit_delay_ticks: 0

# Only play gun hit feedback when a confirmed projectile hit actually deals damage.
hitmarker_only_on_real_damage: true

# Debug exact projectile hit resolution in the server log.
debug_projectile_hits: false

# Debug - only use this if you know what you're doing
debug: false

# Disabled Worlds
# Worlds guns will not fire in
disabledWorlds:

# Whether or not to update guns when a player changes worlds
# Useful for per-world permissions and stuff
updateGunsOnWorldChange: false